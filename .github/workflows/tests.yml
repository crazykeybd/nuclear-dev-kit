name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 回归测试
        run: python -m unittest discover -s tests -v
      - name: 构建分发包
        run: python tools/build_dist.py --output "${{ runner.temp }}/dist"

  offline:
    # 断网可用的硬约束：安装、注册、门禁都不得访问网络
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 无网络时测试仍然通过
        run: python -m unittest discover -s tests
        env:
          # 让所有套接字连接立即失败，任何隐藏的网络依赖都会暴露。
          # 只写小写：Actions 的 env 键大小写不敏感，http_proxy 与 HTTP_PROXY 同时出现会被判为重复键。
          http_proxy: http://127.0.0.1:1
          https_proxy: http://127.0.0.1:1
